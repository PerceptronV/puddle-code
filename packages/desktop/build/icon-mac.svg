<?xml version="1.0" encoding="UTF-8"?>
<!-- The macOS app icon source: same artwork as icon.svg but FULL-BLEED —
     macOS 26 (Tahoe) masks every app icon into its own squircle and plates
     icons that draw their own rounded shape on a white background, so the
     mac icns must fill the canvas edge to edge and leave the rounding to the
     OS. The mark keeps the visual proportion it has inside icon.svg's 824px
     squircle (648/824 ≈ 79% → 0.402 × 2000 units on the 1024 canvas).
     Rasterised to icon.icns by scripts/render-icon.sh — re-run it after
     editing this file. icon.svg remains the Linux source (no OS masking
     there). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00132b"/>
      <stop offset="1" stop-color="#000a14"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.402) translate(-1000 -1000)"
     fill="none" stroke="#ddb28c" stroke-linecap="round" stroke-linejoin="round" stroke-width="120">
    <circle cx="1197.64" cy="716.31" r="615.6" />
    <line x1="925.58" y1="716.31" x2="925.58" y2="1529.88" />
    <path d="M925.58,1529.88c0,124.93-101.28,226.21-226.21,226.21-124.93,0-226.21-101.28-226.21-226.21s101.28-226.21,226.21-226.21c124.93,0,226.21,101.28,226.21,226.21Z" />
    <path d="M925.58,1529.88c0,204.02-165.39,369.41-369.41,369.41-204.02,0-369.41-165.39-369.41-369.41,0-204.02,165.39-369.41,369.41-369.41,204.02,0,369.41,165.39,369.41,369.41Z" />
    <circle cx="1197.64" cy="716.31" r="272.05" />
  </g>
</svg>
