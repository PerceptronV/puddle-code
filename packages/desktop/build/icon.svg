<?xml version="1.0" encoding="UTF-8"?>
<!-- The LINUX app icon source: the puddle mark (packages/web/public/puddle.svg,
     stroke geometry unchanged) in the dark theme's gold (khaki-300 #ddb28c)
     on a navy-900→950 squircle, laid out on the Apple icon grid (1024 canvas,
     824 squircle, radius ~185) — Linux applies no mask, so the artwork rounds
     itself. Rasterised to icon.png by scripts/render-icon.sh — re-run it after
     editing this file. The macOS icns comes from icon-mac.svg (full-bleed;
     macOS 26+ masks icons itself and plates self-rounded artwork on white). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00132b"/>
      <stop offset="1" stop-color="#000a14"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.324) translate(-1000 -1000)"
     fill="none" stroke="#ddb28c" stroke-linecap="round" stroke-linejoin="round" stroke-width="120">
    <circle cx="1197.64" cy="716.31" r="615.6" />
    <line x1="925.58" y1="716.31" x2="925.58" y2="1529.88" />
