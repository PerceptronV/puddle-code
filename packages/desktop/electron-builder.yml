# Packaging for the desktop shell (`pnpm --filter @puddle/desktop dist`).
# The bundle is self-contained (dist/ carries main, preloads, install.sh and
# the web UI); install.sh is READ from inside app.asar (Electron patches fs),
# never executed from disk, so nothing needs asarUnpack.
#
# Signing is environment-driven so local/dev/CI-without-secrets builds stay
# unsigned automatically: electron-builder signs when CSC_LINK +
# CSC_KEY_PASSWORD are set, and the release workflow adds
# `-c.mac.notarize=true` (needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID) only when the certificate secrets exist — see
# .github/workflows/release.yml "desktop" job.
# Icon: build/icon.icns (mac) and build/icon.png (linux) are picked up from
# the default buildResources dir — rendered from build/icon.svg by
# scripts/render-icon.sh, and committed so CI needs no rasteriser.
appId: code.puddle.desktop
productName: Puddle
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
linux:
  # Without this, electron-builder derives the executable name from the package
  # name (`@puddle/desktop` → `@puddledesktop`) and the AppImage build rejects
  # the `@` as unsafe in file paths.
  executableName: puddle-desktop
  # Name the installed .desktop file after `desktopName` in package.json so it
  # matches StartupWMClass and Electron's app_id (window association).
  syncDesktopName: true
  target:
    - AppImage
  category: Development
