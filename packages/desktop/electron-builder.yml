# Packaging for the desktop shell (`pnpm --filter @puddle-code/desktop dist`).
# The bundle is self-contained (dist/ carries main, preloads, install.sh and
# the web UI); install.sh is READ from inside app.asar (Electron patches fs).
# The SSH askpass helper is the sole unpacked file because Electron's
# run-as-Node mode executes it as a real script from a child process.
#
# Developer ID signing is environment-driven: electron-builder signs when
# CSC_LINK + CSC_KEY_PASSWORD are set, and the release workflow adds
# `-c.mac.notarize=true` (needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID) only when the certificate secrets exist — see
# .github/workflows/release.yml "desktop" job. Without certificate secrets,
# releases use `-c.mac.identity=- -c.mac.hardenedRuntime=false` to seal the app
# with an ad-hoc signature (its frameworks have no Team ID for library validation);
# unset empty CSC_LINK/CSC_KEY_PASSWORD first so missing GitHub secrets cannot
# trigger certificate import. Packaging uses --publish never; the release job
# publishes the completed artefact set after every build passes.
# `identity=null` leaves Electron's linker signature without a bound app identity.
# Icon: build/icon.icns (mac, from the full-bleed icon-mac.svg — macOS 26+
# applies its own squircle mask) and build/icon.png (linux, from icon.svg,
# self-rounded) are picked up from the default buildResources dir — rendered
# by scripts/render-icon.sh, and committed so CI needs no rasteriser.
appId: code.puddle.desktop
productName: Puddle
copyright: Copyright © 2026 Yiding Song
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - dist/askpass-helper.cjs
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
linux:
  # Without this, electron-builder derives the executable name from the package
  # name (`@puddle-code/desktop` → `@puddle-codedesktop`) and the AppImage build rejects
  # the `@` as unsafe in file paths.
  executableName: puddle-desktop
  # Name the installed .desktop file after `desktopName` in package.json so it
  # matches StartupWMClass and Electron's app_id (window association).
  syncDesktopName: true
  target:
    - AppImage
  category: Development
