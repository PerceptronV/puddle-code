<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>SSH Authentication</title>
    <!-- shared-prompt-appearance -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg-surface);
        color: var(--text-primary);
        font:
          13px/1.45 system-ui,
          sans-serif;
        padding: 20px 22px;
        user-select: none;
      }
      #target {
        margin-bottom: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
      }
      #prompt {
        display: block;
        min-height: 1.45em;
        max-height: 4.35em;
        margin-bottom: 8px;
        overflow-y: auto;
        color: var(--text-muted);
        white-space: pre-wrap;
        user-select: text;
      }
      input {
        width: 100%;
        border: 0;
        outline: 0;
        border-radius: var(--ui-radius);
        background: color-mix(in srgb, var(--border) 50%, transparent);
        color: var(--text-primary);
        font:
          13px/1 ui-monospace,
          monospace;
        padding: 9px 10px;
      }
      input:focus {
        background: color-mix(in srgb, var(--border) 80%, transparent);
      }
      .note {
        flex: 1;
        color: var(--text-muted);
        font-size: 11px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: var(--ui-radius);
        padding: 7px 14px;
        font: inherit;
        cursor: pointer;
        background: color-mix(in srgb, var(--border) 50%, transparent);
        color: var(--text-primary);
      }
      button:hover {
        background: color-mix(in srgb, var(--border) 80%, transparent);
      }
      button.primary {
        background: var(--action);
        color: var(--action-ink);
      }
      button.primary:hover {
        background: var(--action-hover);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="target"></div>
    <label id="prompt" for="answer">SSH authentication</label>
    <input id="answer" type="password" autocomplete="off" spellcheck="false" />
    <div class="row">
      <span class="note">Sent to the system ssh process and never stored.</span>
      <button id="cancel" type="button">Cancel</button>
      <button id="submit" type="button" class="primary">Continue</button>
    </div>
    <script>
      const target = document.getElementById('target');
      const prompt = document.getElementById('prompt');
      const answer = document.getElementById('answer');
      const submit = document.getElementById('submit');
      const cancel = document.getElementById('cancel');
      let kind = 'secret';

      const accept = () => {
        window.puddleSshAuth.submit(kind === 'confirm' ? 'yes' : answer.value);
        answer.value = '';
      };
      submit.addEventListener('click', accept);
      cancel.addEventListener('click', () => window.puddleSshAuth.cancel());
      answer.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') accept();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.puddleSshAuth.cancel();
        if (event.key === 'Enter' && kind === 'confirm') accept();
      });

      window.puddleSshAuth.onRequest((request) => {
        kind = request.kind;
        target.textContent = request.target;
        target.title = request.target;
        document.title = `SSH Authentication — ${request.target}`;
        prompt.textContent = request.prompt;
        answer.hidden = kind === 'confirm';
        cancel.textContent = kind === 'confirm' ? 'No' : 'Cancel';
        submit.textContent = kind === 'confirm' ? 'Yes' : 'Continue';
        if (kind === 'secret') answer.focus();
        else submit.focus();
      });
    </script>
  </body>
</html>
