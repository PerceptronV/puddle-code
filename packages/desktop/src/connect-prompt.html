<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Connect to SSH Host</title>
    <!-- shared-prompt-appearance -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg-surface);
        color: var(--text-primary);
        font:
          13px/1.45 system-ui,
          sans-serif;
        padding: 20px 22px;
        user-select: none;
      }
      label {
        display: block;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        border: 0;
        outline: 0;
        border-radius: var(--ui-radius);
        background: color-mix(in srgb, var(--border) 50%, transparent);
        color: var(--text-primary);
        font:
          13px/1 ui-monospace,
          monospace;
        padding: 9px 10px;
      }
      input:focus {
        background: color-mix(in srgb, var(--border) 80%, transparent);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
      }
      #status {
        flex: 1;
        color: var(--text-muted);
        max-height: 3.9em;
        overflow-y: auto;
        user-select: text;
      }
      #status.error {
        color: var(--danger);
      }
      button {
        border: 0;
        border-radius: var(--ui-radius);
        padding: 7px 14px;
        font: inherit;
        cursor: pointer;
        background: color-mix(in srgb, var(--border) 50%, transparent);
        color: var(--text-primary);
      }
      button:hover {
        background: color-mix(in srgb, var(--border) 80%, transparent);
      }
      button.primary {
        background: var(--action);
        color: var(--action-ink);
      }
      button.primary:hover {
        background: var(--action-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <label for="host">user@host — or any destination your ssh config knows</label>
    <input
      id="host"
      type="text"
      spellcheck="false"
      autocomplete="off"
      placeholder="dev@build-box"
    />
    <div class="row">
      <div id="status"></div>
      <button id="cancel" type="button">Cancel</button>
      <button id="connect" type="button" class="primary">Connect</button>
    </div>
    <script>
      const host = document.getElementById('host');
      const status = document.getElementById('status');
      const connect = document.getElementById('connect');
      const cancel = document.getElementById('cancel');

      const submit = () => {
        if (host.value.trim() === '') return;
        window.puddlePrompt.submit(host.value);
      };
      connect.addEventListener('click', submit);
      cancel.addEventListener('click', () => window.puddlePrompt.cancel());
      host.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit();
        if (e.key === 'Escape') window.puddlePrompt.cancel();
      });

      window.puddlePrompt.onStatus(({ state, message }) => {
        const busy = state === 'connecting';
        connect.disabled = busy;
        host.disabled = busy;
        status.classList.toggle('error', state === 'error');
        status.textContent = busy ? `Connecting to ${host.value.trim()}…` : (message ?? '');
        if (state === 'error') host.focus();
      });

      host.focus();
    </script>
  </body>
</html>
