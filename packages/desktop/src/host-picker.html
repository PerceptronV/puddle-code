<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>New Puddle Window</title>
    <!-- shared-prompt-appearance -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg-surface);
        color: var(--text-primary);
        font:
          13px/1.45 system-ui,
          sans-serif;
        padding: 18px 16px 14px;
        user-select: none;
      }
      p.hint {
        color: var(--text-muted);
        padding: 0 6px 10px;
      }
      #hosts {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 264px;
        overflow-y: auto;
      }
      button.host {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: var(--ui-radius);
        padding: 8px 10px;
        font: inherit;
        color: var(--text-primary);
        background: transparent;
        cursor: pointer;
      }
      button.host:hover {
        background: color-mix(in srgb, var(--border) 50%, transparent);
      }
      button.host:active {
        background: color-mix(in srgb, var(--border) 80%, transparent);
      }
      button.host:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.host .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.host .identity-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      button.host[data-colour] {
        color: color-mix(in srgb, var(--host-colour) 45%, var(--host-shade));
      }
      [data-theme='dark'] button.host[data-colour] {
        color: color-mix(in srgb, var(--host-colour) 18%, var(--host-paper));
      }
      button.host .note {
        color: var(--text-muted);
        font-size: 11px;
        margin-left: auto;
      }
      #status {
        min-height: 1.5em;
        margin-top: 10px;
        padding: 0 6px;
        color: var(--text-muted);
        max-height: 3.9em;
        overflow-y: auto;
        user-select: text;
      }
      #status.error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <p class="hint">Host</p>
    <div id="hosts"></div>
    <div id="status"></div>
    <script>
      const hosts = document.getElementById('hosts');
      const status = document.getElementById('status');
      let busy = false;

      const row = (name, note, onPick, target, identity) => {
        const button = document.createElement('button');
        button.className = 'host';
        button.type = 'button';
        button.disabled = busy;
        if (target) button.title = target;
        const tokens = {
          navy: '--identity-navy',
          gold: '--identity-gold',
          blue: '--ansi-blue',
          green: '--ansi-green',
          red: '--ansi-red',
          violet: '--ansi-magenta',
          cyan: '--ansi-cyan',
        };
        const colour = identity?.colour;
        if (colour && (Object.hasOwn(tokens, colour) || /^#[0-9a-f]{6}$/i.test(colour))) {
          button.dataset.colour = colour;
          button.style.setProperty(
            '--host-colour',
            Object.hasOwn(tokens, colour) ? `var(${tokens[colour]})` : colour,
          );
        }
        if (target) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          for (const [key, value] of Object.entries({
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            'stroke-width': '2',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round',
            'aria-hidden': 'true',
            class: 'identity-icon',
          }))
            svg.setAttribute(key, value);
          const fallback = [
            { tag: 'rect', attrs: { x: '2', y: '2', width: '20', height: '8', rx: '2' } },
            { tag: 'rect', attrs: { x: '2', y: '14', width: '20', height: '8', rx: '2' } },
            { tag: 'path', attrs: { d: 'M6 6h.01M6 18h.01' } },
          ];
          for (const node of identity?.icon ?? fallback) {
            const shape = document.createElementNS('http://www.w3.org/2000/svg', node.tag);
            for (const [key, value] of Object.entries(node.attrs)) shape.setAttribute(key, value);
            svg.appendChild(shape);
          }
          button.appendChild(svg);
        }
        const label = document.createElement('span');
        label.className = 'name';
        label.textContent = name;
        button.appendChild(label);
        if (note) {
          const aside = document.createElement('span');
          aside.className = 'note';
          aside.textContent = note;
          button.appendChild(aside);
        }
        button.addEventListener('click', () => {
          if (!busy) onPick();
        });
        hosts.appendChild(button);
        return button;
      };

      const renderHosts = (entries) => {
        const focused = document.activeElement?.title;
        hosts.replaceChildren();
        for (const { target, identity } of entries) {
          const name = identity?.name ?? (target === 'local' ? 'this machine' : target);
          const button = row(
            name,
            target === 'local' ? 'local' : 'ssh',
            () => window.puddlePicker.choose(target),
            target,
            identity,
          );
          if (focused === target) button.focus();
        }
        row('remote ssh', '⌘⇧O', () => window.puddlePicker.other());
      };
      window.puddlePicker.recents().then(renderHosts);
      window.puddlePicker.onHosts(renderHosts);

      window.puddlePicker.onStatus(({ state, message }) => {
        busy = state === 'connecting';
        for (const button of hosts.querySelectorAll('button')) button.disabled = busy;
        status.classList.toggle('error', state === 'error');
        status.textContent = state === 'connecting' ? (message ?? 'Connecting…') : (message ?? '');
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.puddlePicker.cancel();
      });
    </script>
  </body>
</html>
