<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>New Puddle Window</title>
    <!-- shared-prompt-appearance -->
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg-surface);
        color: var(--text-primary);
        font:
          13px/1.45 system-ui,
          sans-serif;
        padding: 18px 16px 14px;
        user-select: none;
      }
      p.hint {
        color: var(--text-muted);
        padding: 0 6px 10px;
      }
      #hosts {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 264px;
        overflow-y: auto;
      }
      button.host {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: var(--ui-radius);
        padding: 8px 10px;
        font: inherit;
        color: var(--text-primary);
        background: transparent;
        cursor: pointer;
      }
      button.host:hover {
        background: color-mix(in srgb, var(--border) 50%, transparent);
      }
      button.host:active {
        background: color-mix(in srgb, var(--border) 80%, transparent);
      }
      button.host:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.host .name {
        font-family: ui-monospace, monospace;
      }
      button.host .note {
        color: var(--text-muted);
        font-size: 11px;
        margin-left: auto;
      }
      #status {
        min-height: 1.5em;
        margin-top: 10px;
        padding: 0 6px;
        color: var(--text-muted);
        max-height: 3.9em;
        overflow-y: auto;
        user-select: text;
      }
      #status.error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <p class="hint">Host</p>
    <div id="hosts"></div>
    <div id="status"></div>
    <script>
      const hosts = document.getElementById('hosts');
      const status = document.getElementById('status');
      let busy = false;

      const row = (name, note, onPick) => {
        const button = document.createElement('button');
        button.className = 'host';
        button.type = 'button';
        const label = document.createElement('span');
        label.className = 'name';
        label.textContent = name;
        button.appendChild(label);
        if (note) {
          const aside = document.createElement('span');
          aside.className = 'note';
          aside.textContent = note;
          button.appendChild(aside);
        }
        button.addEventListener('click', () => {
          if (!busy) onPick();
        });
        hosts.appendChild(button);
        return button;
      };

      window.puddlePicker.recents().then((recents) => {
        row('this machine', 'local', () => window.puddlePicker.choose('local'));
        for (const host of recents) {
          row(host, 'ssh', () => window.puddlePicker.choose(host));
        }
        row('remote ssh', '⌘⇧O', () => window.puddlePicker.other());
      });

      window.puddlePicker.onStatus(({ state, message }) => {
        busy = state === 'connecting';
        for (const button of hosts.querySelectorAll('button')) button.disabled = busy;
        status.classList.toggle('error', state === 'error');
        status.textContent = state === 'connecting' ? (message ?? 'Connecting…') : (message ?? '');
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.puddlePicker.cancel();
      });
    </script>
  </body>
</html>
