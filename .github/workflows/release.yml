name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.plan.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node scripts/check-release-plan.mjs "${GITHUB_REF_NAME#v}" --verify-history

  tarball-linux:
    needs: plan
    strategy:
      # Let both native architectures finish so one failure cannot hide the
      # other architecture's result (as happened in v0.0.44 and v0.0.45).
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    # node-pty is node-gyp-built, so the build container fixes the native ABI
    # floor at glibc 2.28 (RHEL/Rocky 8) instead of inheriting the hosted
    # runner's glibc 2.35. Node 22's official binary has the same floor.
    container:
      image: rockylinux:8
      # The continuity fixture launches independent service processes. Reap
      # exited orphans so zombie groups cannot masquerade as live updaters.
      options: --init
    steps:
      - name: install native build toolchain
        # Rocky 8's system GCC 8 rejects better-sqlite3's -std=c++20 and its
        # unversioned Python 3.6 cannot parse node-gyp 12. Use supported modern
        # toolsets without raising the container's glibc 2.28 floor.
        run: dnf install -y binutils git gcc-toolset-14-gcc-c++ make procps-ng python3.11 tar gzip xz
      - name: verify native ABI floor
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          /opt/rh/gcc-toolset-14/root/usr/bin/g++ -std=c++20 -x c++ -fsyntax-only /dev/null
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
          # The toolset's newer runtime is a build dependency, not a host
          # requirement. Keep the shipped addons free of GLIBCXX/CXXABI deps.
          LDFLAGS: -static-libgcc -static-libstdc++
          npm_config_build_from_source: 'true'
          npm_config_python: /usr/bin/python3.11
          # Workflows build the desktop shell with esbuild only and never
          # launch Electron - skip its ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: verify runtime test host process inspection and orphan reaping
        run: node scripts/check-runtime-test-host.mjs
      - if: needs.plan.outputs.host == 'true'
        run: node scripts/build-tarball.mjs --version "${GITHUB_REF_NAME#v}"
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
      - name: verify packaged runtime continuity
        if: needs.plan.outputs.host == 'true'
        run: PUDDLE_TEST_RUNTIME_RELEASE="dist-release/stage/puddled-${GITHUB_REF_NAME}" PUDDLE_TEST_RUNTIME_ARCHIVE="dist-release/puddled-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" node node_modules/vitest/vitest.mjs run packages/daemon/test/runtime/lifecycle/release.test.ts
      - name: build standalone CLI archive
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @puddle/web... build
          pnpm --filter @puddle-code/cli build
          node scripts/build-cli-tarball.mjs --version "${GITHUB_REF_NAME#v}"
          node scripts/test-cli-tarball.mjs
      - name: verify packaged native ABI
        if: needs.plan.outputs.host == 'true'
        run: node scripts/check-linux-native-abi.mjs dist-release/stage
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error

  tarball-darwin:
    needs: plan
    # darwin-x64 is unpublished while GitHub's last Intel runner queues too
    # slowly to block releases; restore it (or build under Rosetta) if needed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - if: needs.plan.outputs.host == 'true'
        run: node scripts/build-tarball.mjs --version "${GITHUB_REF_NAME#v}"
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
      - name: verify packaged runtime continuity
        if: needs.plan.outputs.host == 'true'
        run: PUDDLE_TEST_RUNTIME_RELEASE="dist-release/stage/puddled-${GITHUB_REF_NAME}" PUDDLE_TEST_RUNTIME_ARCHIVE="dist-release/puddled-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" node node_modules/vitest/vitest.mjs run packages/daemon/test/runtime/lifecycle/release.test.ts
      - name: build standalone CLI archive
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @puddle/web... build
          pnpm --filter @puddle-code/cli build
          node scripts/build-cli-tarball.mjs --version "${GITHUB_REF_NAME#v}"
          node scripts/test-cli-tarball.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-darwin-arm64
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error

  desktop:
    # Packages the Electron shell (packages/desktop). With MAC_CERT_P12 +
    # MAC_CERT_PASSWORD set, the mac build is signed under hardened runtime
    # and — with APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID —
    # notarised; without them an ad-hoc signature seals the app's identity and
    # resources. This does not provide Developer ID trust or OS notification
    # approval. AppImage needs no signing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          # electron-builder fetches its own Electron dist at package time;
          # the node_modules binary is never launched here.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build
        env:
          # Bakes the release-source repository into the bundled lib so the
          # embedded bootstrap fetches daemon tarballs from the repo that
          # published it (same as the npm CLI build).
          PUDDLE_REPO_SLUG: ${{ github.repository }}
      - name: package (ad-hoc signing without certificate secrets)
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" != "macOS" ]; then
            pnpm exec electron-builder --publish never
          elif [ -n "$CSC_LINK" ]; then
            pnpm exec electron-builder --publish never -c.mac.notarize=true
          else
            echo "no signing certificate secrets — sealing with an ad-hoc signature"
            # GitHub supplies missing secrets as empty strings. electron-builder
            # treats an empty CSC_LINK as a certificate path (the working directory).
            unset CSC_LINK CSC_KEY_PASSWORD
            # Ad-hoc frameworks have no Team ID for hardened runtime library
            # validation. Keep that runtime exclusive to Developer ID builds.
            pnpm exec electron-builder --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          fi
      - name: verify macOS app signature
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Puddle.app
      - name: verify Linux AppImage architecture and contents
        if: runner.os == 'Linux'
        working-directory: packages/desktop/release
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -- *.AppImage
          test "$#" -eq 1
          appimage="$PWD/$1"
          case "$DESKTOP_TARGET:$1" in
            linux-arm64:*-arm64.AppImage) ;;
            linux-x64:*-arm64.AppImage) exit 1 ;;
            linux-x64:*.AppImage) ;;
            *) exit 1 ;;
          esac
          extraction=$(mktemp -d)
          trap 'rm -rf "$extraction"' EXIT
          cd "$extraction"
          # Exercise the native AppImage runtime without FUSE, a display or
          # starting Puddle (which would bootstrap the user's local daemon).
          "$appimage" --appimage-extract > /dev/null
          test -s squashfs-root/resources/app.asar
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { openSync, readSync, closeSync } from 'node:fs';
          const arch = process.env.DESKTOP_TARGET.slice('linux-'.length);
          assert.equal(process.arch, arch, 'Packaging must run on the target architecture');
          const fd = openSync('squashfs-root/puddle-desktop', 'r');
          const header = Buffer.alloc(20);
          try { assert.equal(readSync(fd, header, 0, header.length, 0), header.length); }
          finally { closeSync(fd); }
          assert.deepEqual([...header.subarray(0, 6)], [0x7f, 0x45, 0x4c, 0x46, 2, 1]);
          assert.equal(header.readUInt16LE(18), arch === 'arm64' ? 183 : 62);
          NODE
      - name: checksums
        working-directory: packages/desktop/release
        run: |
          for f in *.dmg *.zip *.AppImage; do
            if [ -f "$f" ]; then shasum -a 256 "$f"; fi
          done > desktop-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          # Explicit globs on purpose: never the .blockmap / latest-*.yml
          # electron-updater metadata — the desktop app self-updates through
          # lib/desktop-update (SPEC §10), which consumes the artefacts +
          # SHA256SUMS directly, not Squirrel's metadata.
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.sha256
          if-no-files-found: error

  release:
    needs: [tarball-linux, tarball-darwin, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist-release
      - name: stage component release manifest
        run: node scripts/check-release-plan.mjs "${GITHUB_REF_NAME#v}" --stage
      - name: assemble SHA256SUMS and the public CLI installer
        run: |
          cat dist-release/*.sha256 > dist-release/SHA256SUMS
          node scripts/stage-installers.mjs dist-release "$GITHUB_REPOSITORY"
      - name: extract release notes from the changelog
        # The notes come from docs/changelogs/CHANGELOG-v<version>.md, cut in
        # the release commit — the single source of truth for both this release
        # and the npm package (CLAUDE.md §"Changelog discipline").
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" > dist-release/RELEASE_NOTES.md
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-release/*.tar.gz \
            dist-release/*.dmg \
            dist-release/*.zip \
            dist-release/*.AppImage \
            dist-release/SHA256SUMS \
            dist-release/install.sh \
            dist-release/release-manifest.json \
            dist-release/daemon-version \
            dist-release/runtime-version \
            --verify-tag --notes-file dist-release/RELEASE_NOTES.md

  npm-publish:
    # Configure this repository and release.yml as a trusted publisher in
    # the npm package settings, with direct publishing allowed (SPEC §10).
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which cannot authenticate through npm OIDC.
      - name: install npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - name: verify package version matches the release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          if (`v${version}` !== process.env.GITHUB_REF_NAME) {
            throw new Error('The CLI package version must match the release tag.');
          }
          NODE
      - name: install dependencies
        run: node scripts/install-ci.mjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: build the CLI and embedded assets
        env:
          # Bakes the release-source repository into the CLI bundle so its
          # bootstrap fetches tarballs from the repo that published it.
          PUDDLE_REPO_SLUG: ${{ github.repository }}
        run: pnpm build
      - name: publish to npm using trusted publishing
        # Not `npm publish -w`: this is a pnpm workspace, so npm sees no
        # workspaces at the root — publish from the package directory. Do not
        # supply NODE_AUTH_TOKEN: npm obtains a short-lived token through OIDC.
        working-directory: packages/cli
        run: npm publish --provenance --access public
