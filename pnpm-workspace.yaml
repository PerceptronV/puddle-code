packages:
  - packages/*
# Native addons ship install scripts (prebuild download / node-gyp);
# esbuild's and electron's download their platform binaries.
allowBuilds:
  better-sqlite3: true
  electron: true
  # Windows-installer helper (electron-builder transitive); its postinstall
  # only fetches Squirrel binaries we don't use — flip on for Windows builds.
  electron-winstaller: false
  esbuild: true
  node-pty: true
